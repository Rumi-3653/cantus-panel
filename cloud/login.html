      <form>
        <label for="user">帳號</label>
        <input id="user" name="user" autocomplete="username" placeholder="輸入帳號" autocapitalize="none" spellcheck="false" required>
        <label for="password">密碼</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="輸入密碼" required>
        <button type="submit"><span>登入</span><span aria-hidden="true">→</span></button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </section>
    <footer><span class="privacy-dot" aria-hidden="true"></span>對話與執行環境，保留在原主機。</footer>
